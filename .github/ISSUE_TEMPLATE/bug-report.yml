name: Bug report
description: Report behaviour that differs from what RecordKit should do.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: area
    attributes:
      label: Affected area
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behaviour
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include the RecordKit version, platform, and other relevant environment details.
    validations:
      required: true
  - type: textarea
    id: data-impact
    attributes:
      label: Potential data impact
      description: Could this lose, corrupt, expose, or incorrectly migrate user data?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context

