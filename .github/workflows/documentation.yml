name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/documentation.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose "**/*.md"
          fail: true

