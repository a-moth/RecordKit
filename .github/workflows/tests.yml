name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.11.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run white-box tests
        run: npx jest --runInBand --no-watchman
      - name: Type-check
        run: npx tsc --noEmit
